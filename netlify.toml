# Netlify build config — auto-detected on connect.
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  base    = "jansetu-ai_frontend"
  publish = "jansetu-ai_frontend/dist"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback so client-side routes work.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-cache all hashed assets; never cache index.html.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
