# Blueprint for Render.com — auto-detected on connect.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: jansetu-backend
    runtime: docker
    rootDir: jansetu-ai_backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: FRONTEND_ORIGIN
        # Update after first Netlify deploy to your real Netlify URL.
        value: https://jansetu-ai.netlify.app
      - key: FIREBASE_PROJECT_ID
        value: jansetu-ai-afa77
      # --- These are marked sync:false — set them in the Render dashboard, not in the repo. ---
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: POLICYMAKER_EMAILS
        sync: false
